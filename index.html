<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          /* ignore */
        }
        // Filter benign HMR WebSocket reconnection notices in sandboxed preview iframe
        try {
          var origError = console.error;
          console.error = function() {
            var first = arguments[0];
            if (typeof first === 'string' && (first.indexOf('[vite] failed to connect to websocket') !== -1 || first.indexOf('WebSocket') !== -1)) {
              return;
            }
            origError.apply(console, arguments);
          };
          window.addEventListener('error', function(event) {
            if (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('failed to connect to websocket') !== -1)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>TruthLens — AI Claim Investigation Engine</title>
    <meta name="description" content="TruthLens searches the live web and compares evidence to help you understand what a claim actually supports." />
    <meta property="og:title" content="TruthLens — AI Claim Investigation Engine" />
